version: "2"
run:
  allow-parallel-runners: true
linters:
  default: all
  disable:
    # Needs a project-specific import allow/deny list; dependencies are reviewed through go.mod.
    - depguard
    # Partial struct literals relying on zero values are idiomatic Go.
    - exhaustruct
    - exhaustruct_v5
    # Version info is injected via -ldflags; commands and logger keep package-level state by design.
    - gochecknoglobals
    # Deprecated in favour of gomodguard_v2, which needs the same allow/deny list as depguard.
    - gomodguard
    # Sentinel errors would add exported API without a consumer: the CLI only prints errors.
    - err113
    # Forbids the scoped `if err := f(); err != nil` form recommended by Effective Go.
    - noinlineerr
    # Commands and logger tests mutate package-level state and the process cwd, so they cannot run in parallel.
    - paralleltest
    # YAML keys are the user-facing .nigiri.yml format; renaming them would break existing configs.
    - tagliatelle
    # Tests exercise unexported helpers, so they live in the package under test.
    - testpackage
    # Short names in short scopes follow Go Code Review Comments.
    - varnamelen
    # Deprecated in favour of wsl_v5.
    - wsl
  settings:
    cyclop:
      # Every `if err != nil` counts as a branch, so the default of 10 flags
      # straight-line setup code; 15 still catches real branching.
      max-complexity: 15
    govet:
      disable:
        - shadow
      enable-all: true
    gosec:
      excludes:
        # Duplicates errcheck.
        - G104
        # Build and config files under the user's nigiri root are not secrets; 0755/0644 are intended.
        - G301
        - G302
        - G306
    mnd:
      ignored-functions:
        - ^os\.(Mkdir|MkdirAll|WriteFile|Chmod)$
        - ^\(\*os\.Root\)\.MkdirAll$
    staticcheck:
      checks:
        - all
        - -SA1006
    wrapcheck:
      ignore-package-globs:
        - github.com/oota-sushikuitee/nigiri/*
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - govet
          - noctx
        path: _test\.go
      # Repeated fixture literals read better inline in table-driven tests.
      - linters:
          - goconst
        path: _test\.go
      # Table-driven and step-by-step scenario tests grow with their cases.
      - linters:
          - cyclop
          - funlen
          - gocognit
          - maintidx
          - nestif
        path: _test\.go
      # Renaming exported pkg/ identifiers would break importers of the module.
      - linters:
          - revive
        text: "stutters|unexported-return"
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
